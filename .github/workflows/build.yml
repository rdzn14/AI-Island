name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Buka projek
        run: |
          ls
          cat part*.txt | tr -d ' \r\n' | base64 -d > projek.tgz
          tar xzf projek.tgz
          ls

      - name: Kunci tandatangan tetap
        run: |
          mkdir -p ~/.android
          tr -d ' \r\n' < keystore.txt | base64 -d > ~/.android/debug.keystore

      - name: Terima lesen Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true

      - name: Bina APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: AI-Island-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
